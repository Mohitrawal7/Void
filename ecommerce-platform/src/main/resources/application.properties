spring.application.name=ecommerce-platform


spring.datasource.url = jdbc:postgresql://localhost:5432/Void
spring.datasource.username = postgres
spring.datasource.password =
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
# Use a long, random, Base64-safe string in real deployments (>= 256 bits for HS256).
# Do NOT commit real secrets to source control - override via env var in production.
app.jwt.secret=ThisIsADemoSecretKeyPleaseReplaceItWithSomethingLongerAndRandom123!
app.jwt.expiration-ms=86400000

# ===== Server =====
server.port=8080