spring.application.name=ecommerce-platform


spring.datasource.url = jdbc:postgresql://localhost:5432/Void
spring.datasource.username = postgres
spring.datasource.password =code
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
# Use a long, random, Base64-safe string in real deployments (>= 256 bits for HS256).
# Do NOT commit real secrets to source control - override via env var in production.
app.jwt.secret=ThisIsADemoSecretKeyPleaseReplaceItWithSomethingLongerAndRandom123!
app.jwt.expiration-ms=86400000

# ===== Server =====
server.port=8080


spring.data.redis.host=localhost
spring.data.redis.port=6379
app.cache.product-list-ttl-seconds=120
app.cache.product-item-ttl-seconds=600
app.cache.cart-ttl-seconds=86400


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

spring.kafka.consumer.group-id=demo-app
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.event
spring.kafka.consumer.auto-offset-reset=earliest

app.kafka.topic.order-created=order-created
app.kafka.topic.stock-updated=stock-updated